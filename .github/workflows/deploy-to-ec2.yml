name: Deploy to EC2

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup SSH
              uses: webfactory/ssh-agent@v0.8.0
              with:
                  ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

            - name: Add EC2 to known hosts
              run: |
                  ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

            - name: Deploy to EC2
              run: |
                  # Create a temporary directory for deployment files
                  ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sudo mkdir -p /tmp/webapp-deploy"

                  # Copy files to EC2
                  scp -r index.html styles.css README.md ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/webapp-deploy/

                  # Move files to nginx web directory and set permissions
                  ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
                    # Backup existing files if they exist
                    if [ -d "/var/www/html" ]; then
                      sudo mkdir -p /var/www/html/backup-$(date +%Y%m%d-%H%M%S)
                      sudo cp -r /var/www/html/* /var/www/html/backup-$(date +%Y%m%d-%H%M%S)/ 2>/dev/null || true
                    fi
                    
                    # Ensure nginx directory exists
                    sudo mkdir -p /var/www/html
                    
                    # Copy new files to nginx directory
                    sudo cp -r /tmp/webapp-deploy/* /var/www/html/
                    
                    # Set proper ownership and permissions
                    sudo chown -R www-data:www-data /var/www/html
                    sudo chmod -R 755 /var/www/html
                    
                    # Clean up temporary files
                    sudo rm -rf /tmp/webapp-deploy
                    
                    # Test nginx configuration
                    sudo nginx -t
                    
                    # Reload nginx to serve new content
                    sudo systemctl reload nginx
                    
                    # Ensure nginx is running
                    sudo systemctl enable nginx
                    sudo systemctl start nginx
                  EOF

            - name: Verify deployment
              run: |
                  # Wait a moment for nginx to reload
                  sleep 5

                  # Check if the website is accessible
                  response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }})
                  if [ $response -eq 200 ]; then
                    echo "✅ Deployment successful! Website is accessible."
                  else
                    echo "❌ Deployment may have failed. HTTP response code: $response"
                    exit 1
                  fi
